name: Release Please

on:
  push:
    branches: [ main ]

# Serialize runs so that merging several PRs at once does not race on
# creating the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags pushed with GITHUB_TOKEN do not trigger other workflows,
      # so dispatch the image build on the new tag explicitly.
      - name: Publish release images
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run docker-publish.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG_NAME}"
